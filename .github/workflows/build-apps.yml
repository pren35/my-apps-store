# Builds every app in the apps/ folder.
# On a pull request it only checks that the apps build (nothing is published).
# After you merge, it signs the apps, puts them in the "apps" release and refreshes the store.
name: Build my apps

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/build-apps.yml"]
  pull_request:
    paths: ["apps/**", ".github/workflows/build-apps.yml"]
  workflow_dispatch:

permissions:
  contents: write             # needed to update the "apps" release
  actions: write              # needed to start the store update

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get this repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore app signing key
        if: env.PUBLISH == 'true'
        env:
          APPS_KEY: ${{ secrets.APPS_KEY }}
        run: |
          [ -n "$APPS_KEY" ] || { echo "::error::Secret APPS_KEY is missing. Paste the whole apps-key.txt file into it."; exit 1; }
          CLEAN=$(printf '%s\n' "$APPS_KEY" | tr -d ' \r\t')
          PW=$(printf '%s\n' "$CLEAN" | awk 'f && NF {print; exit} $0=="APPS_KEY_PASSWORD" {f=1}')
          KS=$(printf '%s\n' "$CLEAN" | awk 'f && NF {printf "%s", $0} $0=="APPS_KEY_BASE64" {f=1}')
          echo "Key data: ${#KS} characters. Password: ${#PW} characters (expected 32)."
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/apps.p12" && [ -n "$PW" ] \
            || { echo "::error::Secret APPS_KEY is not valid. Paste the whole apps-key.txt file again (Ctrl+A, Ctrl+C)."; exit 1; }
          echo "::add-mask::$PW"
          echo "KS_PASS=$PW" >> "$GITHUB_ENV"

      - name: Build the apps
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          AAPT2="$ANDROID_HOME/build-tools/$BT/aapt2"
          mkdir -p "$RUNNER_TEMP/out"
          for d in apps/*/; do
            app=$(basename "$d")
            echo "::group::$app"
            SIGN=()
            if [ "$PUBLISH" = true ]; then
              SIGN=(-Pandroid.injected.signing.store.file="$RUNNER_TEMP/apps.p12"
                    -Pandroid.injected.signing.store.password="$KS_PASS"
                    -Pandroid.injected.signing.key.alias=apps
                    -Pandroid.injected.signing.key.password="$KS_PASS")
            fi
            (cd "$d" && gradle --no-daemon assembleRelease "${SIGN[@]}")

            # Privacy checks: no Google Play Services / ML Kit / Firebase, no internet permission.
            if (cd "$d" && gradle --no-daemon -q dependencies --configuration releaseRuntimeClasspath) \
                 | grep -E 'com\.google\.android\.gms|com\.google\.mlkit|com\.google\.firebase'; then
              echo "::error::$app includes Google Play Services, ML Kit or Firebase."; exit 1
            fi
            APK=$(find "$d/build/outputs/apk/release" -name '*.apk' | head -1)
            if "$AAPT2" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
              echo "::error::$app asks for internet access."; exit 1
            fi
            VERSION=$("$AAPT2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            cp "$APK" "$RUNNER_TEMP/out/$app-$VERSION.apk"
            echo "Built $app $VERSION"
            echo "::endgroup::"
          done
          ls -l "$RUNNER_TEMP/out"

      - name: Publish the apps
        if: env.PUBLISH == 'true'
        working-directory: ${{ runner.temp }}/out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          gh release view apps -R "$R" >/dev/null 2>&1 \
            || gh release create apps -R "$R" --latest=false \
                 --title "My apps (built from the apps folder, do not delete)" \
                 --notes "Signed APKs of the apps in the apps/ folder. The store picks them up from here."
          OLD=$(gh release view apps -R "$R" --json assets -q '.assets[].name')
          gh release upload apps -R "$R" --clobber *.apk
          for name in $OLD; do
            [ -e "$name" ] || gh release delete-asset apps "$name" -R "$R" --yes
          done
          gh workflow run update-store.yml -R "$R" --ref main
          echo "Apps published; store update started."
